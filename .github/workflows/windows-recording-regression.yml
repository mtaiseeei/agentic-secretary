name: Windows recording regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-recording-regression.yml"
      - "plugins/secretary/scripts/**"
      - "plugins/secretary/skills/memory-care/scripts/**"
      - "plugins/secretary/skills/**/SKILL.md"
      - "scripts/sprint-038-patch-002-windows-test.mjs"
      - "scripts/sprint-038-patch-003-conversation-migration-test.mjs"
      - "scripts/sprint-050-patch-004-test.mjs"
      - "scripts/sprint-050-patch-005-test.mjs"
      - "scripts/sprint-047-test.mjs"
      - "scripts/sprint-047-patch-001-test.mjs"

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node syntax - secretary store
        shell: pwsh
        run: node --check plugins/secretary/scripts/lib/secretary-store.mjs
      - name: Node syntax - workspace tools
        shell: pwsh
        run: node --check plugins/secretary/scripts/workspace-tools.mjs
      - name: Node syntax - memory tools
        shell: pwsh
        run: node --check plugins/secretary/skills/memory-care/scripts/memory-tools.mjs
      - name: Node syntax - project tools
        shell: pwsh
        run: node --check plugins/secretary/scripts/project-tools.mjs
      - name: Node syntax - owner name transaction
        shell: pwsh
        run: node --check plugins/secretary/scripts/owner-name-transaction.mjs
      - name: Node syntax - conversation migration
        shell: pwsh
        run: node --check plugins/secretary/scripts/lib/conversation-migration.mjs
      - name: Node syntax - Clarity core
        shell: pwsh
        run: node --check plugins/secretary/scripts/lib/clarity-core.mjs
      - name: Node syntax - P001 regression
        shell: pwsh
        run: node --check scripts/sprint-047-patch-001-test.mjs
      - name: Windows path, rollback, retry, and boundary regression
        shell: pwsh
        run: node scripts/sprint-038-patch-002-windows-test.mjs --require-windows
      - name: Conversation migration sibling temp and rollback regression
        shell: pwsh
        run: node scripts/sprint-038-patch-003-conversation-migration-test.mjs
      - name: Clarity Harness scan and Windows native regression
        shell: pwsh
        run: node scripts/sprint-050-patch-004-test.mjs --require-windows
      - name: Clarity state structure and Secret redaction regression
        shell: pwsh
        run: node scripts/sprint-050-patch-005-test.mjs --require-windows
      - name: Clarity logical write failure recovery regression (P001)
        shell: pwsh
        run: node scripts/sprint-047-patch-001-test.mjs
      - name: Clarity concurrent write regression (Sprint 047)
        shell: pwsh
        run: node scripts/sprint-047-test.mjs
      - name: Preserve exact reviewed candidate (no worktree or Git credentials)
        if: always()
        shell: pwsh
        run: |
          git archive --format=zip --output="$env:RUNNER_TEMP/clarity-review-candidate.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "candidate-archive-failed" }
      - name: Upload candidate for independent diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clarity-review-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/clarity-review-candidate.zip
          retention-days: 3
          if-no-files-found: error
